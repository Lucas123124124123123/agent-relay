name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: agent-relay
  KIND_CLUSTER: agent-relay
  K8S_NAMESPACE: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@127.0.0.1:5432/relay
      # Not 8000: when this workflow is run locally with act the runner can
      # share the host network, where 8000 is often already taken.
      RELAY_BASE_URL: http://127.0.0.1:8001

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run the starter unit tests
        # The starter suite drops and recreates tables, so keep it off the
        # Postgres database the integration test is about to use.
        env:
          RELAY_DATABASE_URL: sqlite:///./ci-unit.db
        run: uv run pytest test_agent_relay.py -q

      - name: Start the API against PostgreSQL
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$RELAY_BASE_URL/ready" > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API never became ready; uvicorn log follows"
          cat uvicorn.log
          exit 1

      - name: Run the API integration test against PostgreSQL
        run: uv run pytest test_integration.py -q

  deploy:
    # Only runs when every job it needs succeeded. If a test fails this job is
    # skipped, so the version already running in the cluster stays untouched.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute a unique image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: docker build -t "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" .

      - name: Install kubectl and kind
        run: |
          if ! command -v kubectl > /dev/null; then
            curl -fsSLo /usr/local/bin/kubectl \
              "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x /usr/local/bin/kubectl
          fi
          if ! command -v kind > /dev/null; then
            curl -fsSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
            chmod +x /usr/local/bin/kind
          fi

      - name: Point kubectl at the kind cluster
        # kind reads the cluster's connection details straight from the Docker
        # daemon, so this works without a kubeconfig baked into the runner.
        run: |
          mkdir -p "$HOME/.kube"
          kind get kubeconfig --name "$KIND_CLUSTER" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Load the image into kind
        run: kind load docker-image "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" --name "$KIND_CLUSTER"

      - name: Apply the manifests
        run: kubectl apply -f k8s/

      - name: Roll out the new image
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/agent-relay \
            api="$IMAGE_NAME:${{ steps.tag.outputs.tag }}"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/agent-relay --timeout=300s

      - name: Show what is running
        run: kubectl -n "$K8S_NAMESPACE" get pods -o wide
