services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: agent-relay:local
    environment:
      # "postgres" is the Compose service name, which is the hostname on the
      # shared network. localhost would point at the API container itself.
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
